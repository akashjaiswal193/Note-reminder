<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">

        <!-- Navigation -->
        <div class="controls">

            <button id="prevBtn">↑</button>

            <button id="addBtn">+</button>

            <button id="nextBtn">↓</button>

        </div>

        <!-- Note Card -->
        <div class="note-card">

            <div class="profile">

                <img
                    src="https://i.pravatar.cc/100"
                    alt="profile"
                >

                <div class="info">

                <h2></h2>

                <div class="details">

                    <div>
                        <p>Home Town</p>
                        <span></span>
                    </div>

                    <div>
                        <p>Category</p>
                        <span></span>
                    </div>

                </div>

            </div>

            </div>

            <div class="actions">

                <button id="callBtn">
                    Call
                </button>

                <button id="messageBtn">
                    Message
                </button>

            </div>

        </div>

        <!-- Color Buttons -->
        <div class="colors">

            <button class="filter-btn black">
                Emergency
            </button>

            <button class="filter-btn purple">
                Important
            </button>

            <button class="filter-btn orange">
                Urgent
            </button>

            <button class="filter-btn green">
                No Rush
            </button>

            <button class="filter-btn all">
                All
            </button>

        </div>

    </div>

    <script src="app.js"></script>

</body>
</html>
